<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>Google Ads Başlangıç Formu · istanbul.marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--surface:#fff;--ink:#07111f;--muted:#5d6470;--subtle:#8a909a;--line:#e6e2da;--line-2:#cfc9bd;--accent:#f04432;--good:#1f8a4c;--good-bg:#e7f4ec;--bad:#c2341f;--bad-bg:#fde9e5;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--surface:#111a2b;--ink:#eef1f5;--muted:#a3abb8;--subtle:#7d8696;--line:#1f2a3d;--line-2:#2f3c54;--good:#4cc283;--good-bg:#11291e;--bad:#ff7a66;--bad-bg:#33171a}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
.w{max-width:820px;margin:0 auto;padding:0 20px}
header{padding:calc(18px + env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between}
header img{height:20px;width:auto}.dk{display:none}
@media (prefers-color-scheme:dark){.lt{display:none}.dk{display:block}}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:26px 0 8px}
.lead{color:var(--muted);font-size:15px}
.banner{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:600;font-size:14px}
.sec{margin-top:44px}
.sec h2{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;color:var(--ink)}
.sec h2 .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:0}
.sec .intro{font-size:14px;color:var(--muted);margin:8px 0 0 42px;max-width:620px}
.sec .card{margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 20px}
@media(min-width:720px){.card{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;row-gap:6px;padding:28px 32px}.f{border-bottom:0;padding:8px 0}.f.wide{grid-column:1/-1}h1{font-size:34px}.lead{font-size:16px;max-width:640px}}
.f{padding:18px 0;border-bottom:1px solid var(--line)}.f:last-child{border-bottom:0}
.f>label,.f>.lab{display:block;font-weight:700;font-size:15px;line-height:1.4}
.req{color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--subtle);opacity:.75}
.hint{font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;margin-top:12px;border:1px solid var(--line-2);border-radius:11px;background:var(--bg);padding:0 13px;height:46px;font-size:16px;outline:none;transition:border-color .15s}
textarea{padding:11px 13px;height:auto;resize:vertical;line-height:1.45}
input:focus,textarea:focus{border-color:var(--ink);outline:3px solid color-mix(in srgb,var(--ink) 14%,transparent);outline-offset:0}
.f.err input,.f.err textarea{border-color:var(--bad)}
.f.err .msg{display:block}.msg{display:none;color:var(--bad);font-size:12.5px;margin-top:6px;font-weight:600}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ch button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);font-weight:600;font-size:14px;cursor:pointer}
.ch button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ck{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;cursor:pointer;margin-top:2px}
.ck i{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;margin-top:1px}
.ck[aria-pressed="true"] i{background:var(--good);border-color:var(--good);color:#fff}
.ck span{font-weight:500;font-size:14px;line-height:1.5}
.bar{position:sticky;bottom:0;margin:40px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.btn{width:100%;height:52px;border-radius:13px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.btn[disabled]{opacity:.55}
.sv{font-size:12.5px;color:var(--subtle);text-align:center;margin-top:8px;min-height:18px}
.done{text-align:center;padding:64px 8px}
.done b{display:block;font-size:24px;letter-spacing:-.02em;margin-bottom:10px}
.done .tick{width:60px;height:60px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:0 auto 20px}
.foot{padding:30px 0 40px;text-align:center;font-size:12.5px;color:var(--subtle)}
.state{padding:80px 8px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
</style>
</head>
<body>
<header><div class="w"><img class="lt" src="/brand/logo-wordmark-on-light.png" alt="istanbul.marketing"><img class="dk" src="/brand/logo-wordmark-on-dark.png" alt="istanbul.marketing"></div></header>
<main class="w" id="app"><div class="state">Yükleniyor…</div></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const K = new URLSearchParams(location.search).get("k") || "";
const API = "/api/public?type=adsform&k=" + encodeURIComponent(K);
const DKEY = "adsform:" + K;
let schema = [], A = {}, submitted = false, name = "";

function draftSave() { try { localStorage.setItem(DKEY, JSON.stringify(A)); } catch {} }
function draftLoad() { try { return JSON.parse(localStorage.getItem(DKEY) || "{}"); } catch { return {}; } }
function fmt(d) { try { return new Date(d).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" }); } catch { return ""; } }

function field(f) {
  const v = A[f.id] ?? "";
  const lab = `<span>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</span>`;
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : "";
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "";
  const msg = `<div class="msg">Bu alan zorunlu.</div>`;
  if (f.type === "choice") return `<div class="f wide" data-id="${f.id}"><span class="lab">${esc(f.label)}</span>${hint}<div class="ch" role="group">${f.options.map((o) => `<button type="button" data-v="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join("")}</div></div>`;
  if (f.type === "check") return `<div class="f wide" data-id="${f.id}"><div class="ck" role="checkbox" tabindex="0" aria-checked="${!!v}" aria-pressed="${!!v}"><i><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></i><span>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</span></div>${msg}</div>`;
  const id = "i-" + f.id;
  if (f.type === "textarea") return `<div class="f wide" data-id="${f.id}"><label for="${id}">${lab}</label>${hint}<textarea id="${id}"${ph} rows="${f.rows || 3}" maxlength="2000">${esc(v)}</textarea>${msg}</div>`;
  return `<div class="f" data-id="${f.id}"><label for="${id}">${lab}</label>${hint}<input id="${id}"${ph} type="${f.type === "tel" ? "tel" : f.type === "email" ? "email" : "text"}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ""} autocomplete="off" maxlength="300" value="${esc(v)}">${msg}</div>`;
}

function render(data) {
  const banner = submitted ? `<div class="banner">Formunuz ${data.at ? fmt(data.at) + " tarihinde " : ""}bize ulaştı. Aşağıdan bilgilerinizi güncelleyebilirsiniz.</div>` : "";
  $("#app").innerHTML = `
    <h1>Google Ads Başlangıç Formu</h1>
    <p class="lead">${esc(name)} için reklamlarınızı doğru kurabilmemiz adına birkaç soruya ihtiyacımız var. Her sorunun altında ne yazacağınızı gösteren bir örnek var. Bilmediğiniz soruları boş bırakın, görüşmede birlikte dolduracağız. Yaklaşık 10 dakika sürer. Yazdıklarınız bu cihazda otomatik saklanır.</p>
    ${banner}
    <form id="frm" novalidate>
      ${schema.map((s) => `<section class="sec"><h2>${(m => m ? `<span class="n">${m[1]}</span>${esc(m[2])}` : esc(s.title))(s.title.match(/^(\d+)\.\s*(.*)$/))}</h2>${s.intro ? `<p class="intro">${esc(s.intro)}</p>` : ""}<div class="card">${s.fields.map(field).join("")}</div></section>`).join("")}
      <div class="hp" aria-hidden="true"><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
      <div class="bar"><button class="btn" type="submit" id="send">${submitted ? "Bilgilerimi güncelle" : "Formu gönder"}</button><div class="sv" id="sv"></div></div>
    </form>
    <p class="foot">Formdaki bilgiler yalnızca reklam kurulumu için kullanılır ve üçüncü kişilerle paylaşılmaz.<br>istanbul.marketing · business@istanbul.marketing</p>`;
  const f = $("#frm");
  f.addEventListener("input", (e) => { const w = e.target.closest("[data-id]"); if (!w) return; A[w.dataset.id] = e.target.value; w.classList.remove("err"); draftSave(); });
  f.addEventListener("click", (e) => {
    const b = e.target.closest(".ch button"); const w = e.target.closest("[data-id]");
    if (b && w) { const was = b.getAttribute("aria-pressed") === "true"; w.querySelectorAll(".ch button").forEach((x) => x.setAttribute("aria-pressed", "false")); if (!was) { b.setAttribute("aria-pressed", "true"); A[w.dataset.id] = b.dataset.v; } else delete A[w.dataset.id]; draftSave(); return; }
    const c = e.target.closest(".ck"); if (c && w) { toggleCheck(c, w); }
  });
  f.addEventListener("keydown", (e) => { const c = e.target.closest(".ck"); if (c && (e.key === " " || e.key === "Enter")) { e.preventDefault(); toggleCheck(c, c.closest("[data-id]")); } });
  f.addEventListener("submit", send);
}
function toggleCheck(c, w) { const on = c.getAttribute("aria-pressed") !== "true"; c.setAttribute("aria-pressed", on); c.setAttribute("aria-checked", on); A[w.dataset.id] = on; w.classList.remove("err"); draftSave(); }

async function send(e) {
  e.preventDefault();
  const missing = [];
  schema.forEach((s) => s.fields.forEach((f) => { if (f.required && (f.type === "check" ? A[f.id] !== true : !String(A[f.id] || "").trim())) missing.push(f.id); }));
  document.querySelectorAll("[data-id]").forEach((w) => w.classList.toggle("err", missing.includes(w.dataset.id)));
  if (missing.length) { $("#sv").textContent = "Lütfen zorunlu (*) alanları doldurun."; document.querySelector(`[data-id="${missing[0]}"]`).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const btn = $("#send"); btn.disabled = true; $("#sv").textContent = "Gönderiliyor…";
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers: A, hp: $("#hp").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Gönderilemedi");
    try { localStorage.removeItem(DKEY); } catch {}
    $("#app").innerHTML = `<div class="done"><div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><b>Teşekkürler</b><p class="lead">Bilgileriniz bize ulaştı. En kısa sürede sizinle iletişime geçip kampanya planını paylaşacağız.</p></div><p class="foot">istanbul.marketing · business@istanbul.marketing</p>`;
    window.scrollTo({ top: 0 });
  } catch (err) { btn.disabled = false; $("#sv").textContent = (err && err.message) || "Gönderilemedi. Lütfen tekrar deneyin."; }
}

(async function init() {
  if (!/^[a-f0-9]{32}$/.test(K)) { $("#app").innerHTML = `<div class="state"><b>Bağlantı geçersiz</b>Lütfen size gönderilen bağlantıyı eksiksiz açın.</div>`; return; }
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    schema = d.schema; name = d.name; submitted = d.status === "gonderildi";
    A = { ...(d.answers || {}), ...(submitted ? {} : draftLoad()) };
    if (!A.firma) A.firma = name;
    render(d);
  } catch (e) { $("#app").innerHTML = `<div class="state"><b>Form açılamadı</b>Bağlantı geçersiz olabilir ya da bağlantınızda sorun var. Lütfen bizimle iletişime geçin.</div>`; }
})();
</script>
</body>
</html>
